set-option -g default-shell /usr/bin/zsh

set -ag terminal-overrides ",xterm-256color:RGB"

set-option -g -q mouse on
set-option -g prefix C-b
set -g base-index 1
set -s escape-time 0
set -g history-limit 10000
set -g renumber-windows on
set -g set-clipboard on 
set -g status-position top
set -g default-terminal "${TERM}"

set-window-option -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# vim-like pane switching
bind-key C-l last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r v split-window -v
bind -r s split-window -h

# map windows to home row (one row up, to avoid pane nav conflict)
bind -r u select-window -t 1
bind -r i select-window -t 2
bind -r o select-window -t 3
bind -r p select-window -t 4

bind r source-file ~/.tmux.conf

# Session viewer (prefix + w)
set -g mode-style 'fg=#c0caf5,bg=#283457,bold'
bind-key w choose-tree -Z -F '#{?pane_format,#[fg=#7dcfff] ● #{pane_current_command} #[fg=#565f89]#{b:pane_current_path},#{?window_format,#[fg=#9ece6a]  #{window_index}: #{pane_current_command}#{?window_active, #[fg=#ff9e64]● active,}#{?window_zoomed_flag, #[fg=#e0af68][Z],},#{?session_attached,#[fg=#7aa2f7]● attached,}}}'

# Session finder (prefix + f)
bind-key f run-shell "~/.config/bin/tmux-sessionizer.sh"

# Agent Viewer
bind-key A run-shell "~/.config/bin/tmux-agent-monitor.sh '#{client_tty}'"
bind-key a display-popup -E -w 90% -h 90% -T " agents " "~/.config/bin/tmux-agent-monitor.sh --popup"
bind-key X kill-session -t agents

# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'fabioluciano/tmux-tokyo-night'

# NOTE: upstream renamed every option from @theme_* to @powerkit_*
set -g @powerkit_theme 'tokyo-night'
set -g @powerkit_theme_variant 'night'
set -g @powerkit_transparent 'false'
set -g @powerkit_plugins 'cpu,memory,git'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

